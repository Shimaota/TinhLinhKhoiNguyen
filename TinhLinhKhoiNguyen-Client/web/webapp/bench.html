<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebGL Bench</title>
<style>
  html, body { margin: 0; background: #000; color: #eee; font: 15px -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #out { position: fixed; left: 8px; top: 8px; right: 8px; background: rgba(0,0,0,.75); padding: 10px; border-radius: 8px; white-space: pre; z-index: 2; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="out">Measuring...</div>
<script>
// Simulates libGDX's PolygonSpriteBatch: DRAWS draws per frame, each uploading ~20 rectangles then drawElements.
// Compares vertex upload strategies to find one that does not make Safari/Metal wait for the GPU.
const DRAWS = 150, QUADS = 20, FLOATS = 5, MS = 3000;
const canvas = document.getElementById('c'), out = document.getElementById('out');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: true, stencil: true, premultipliedAlpha: false });

const vs = `#version 300 es
in vec2 a_position; in vec4 a_color; in vec2 a_texCoord0; out vec4 v_color; out vec2 v_uv;
void main() { v_color = a_color; v_uv = a_texCoord0; gl_Position = vec4(a_position, 0.0, 1.0); }`;
const fs = `#version 300 es
precision mediump float; in vec4 v_color; in vec2 v_uv; uniform sampler2D u_texture; out vec4 o;
void main() { o = v_color * texture(u_texture, v_uv); }`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.bindAttribLocation(prog, 0, 'a_position'); gl.bindAttribLocation(prog, 1, 'a_color'); gl.bindAttribLocation(prog, 2, 'a_texCoord0');
gl.linkProgram(prog); gl.useProgram(prog);

const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
const px = new Uint8Array(1024 * 1024 * 4); for (let i = 0; i < px.length; i++) px[i] = (i * 37) & 255;
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1024, 1024, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

const VERTS = QUADS * 4, IDX = QUADS * 6;
const verts = new Float32Array(10000), idx = new Int16Array(12000);
const colorBits = new Float32Array(new Uint32Array([0x80ffffff]).buffer)[0];
function fill(d, f) {
  for (let q = 0; q < QUADS; q++) {
    const x = ((d * 7 + q * 13 + f) % 100) / 50 - 1, y = ((d * 11 + q * 3) % 100) / 50 - 1, w = 0.25;
    const c = [[x, y, 0, 1], [x + w, y, 1, 1], [x + w, y + w, 1, 0], [x, y + w, 0, 0]];
    for (let k = 0; k < 4; k++) { const o = (q * 4 + k) * FLOATS; verts[o] = c[k][0]; verts[o + 1] = c[k][1]; verts[o + 2] = colorBits; verts[o + 3] = c[k][2]; verts[o + 4] = c[k][3]; }
    const b = q * 4, o = q * 6; idx[o] = b; idx[o + 1] = b + 1; idx[o + 2] = b + 2; idx[o + 3] = b + 2; idx[o + 4] = b + 3; idx[o + 5] = b;
  }
}
function setupAttribs(base) {
  const stride = FLOATS * 4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, stride, base);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.UNSIGNED_BYTE, true, stride, base + 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, base + 12);
}
function mkMesh(vbytes, ibytes) {
  const vao = gl.createVertexArray(), vb = gl.createBuffer(), ib = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, vbytes, gl.DYNAMIC_DRAW); setupAttribs(0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ibytes, gl.DYNAMIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, vb, ib };
}
const libgdx = mkMesh(40000, 24000);
const ring = Array.from({ length: DRAWS * 3 }, () => mkMesh(VERTS * FLOATS * 4, IDX * 2));
let ringPos = 0;
const big = mkMesh(DRAWS * VERTS * FLOATS * 4 * 3, DRAWS * IDX * 2 * 3);
let bigFrame = 0;

const variants = {
  // Current libGDX: bufferData for vertices + bufferSubData for indices on every draw, same buffer
  libgdx(d, f) {
    fill(d, f); gl.bindVertexArray(libgdx.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, libgdx.vb); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW, 0, VERTS * FLOATS);
    gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, idx, 0, IDX);
    gl.drawElements(gl.TRIANGLES, IDX, gl.UNSIGNED_SHORT, 0);
  },
  // glfix.js: bufferSubData overwriting the same buffer
  subdata(d, f) {
    fill(d, f); gl.bindVertexArray(libgdx.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, libgdx.vb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts, 0, VERTS * FLOATS);
    gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, idx, 0, IDX);
    gl.drawElements(gl.TRIANGLES, IDX, gl.UNSIGNED_SHORT, 0);
  },
  // Every draw uses a different buffer (rotating over 3 frames) -> never overwrites data the GPU is still reading
  ring(d, f) {
    fill(d, f); const m = ring[ringPos]; ringPos = (ringPos + 1) % ring.length;
    gl.bindVertexArray(m.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.vb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts, 0, VERTS * FLOATS);
    gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, idx, 0, IDX);
    gl.drawElements(gl.TRIANGLES, IDX, gl.UNSIGNED_SHORT, 0);
  },
  // One large buffer, each draw appends (no overwrite) and changes the vertex pointer offset
  append(d, f) {
    fill(d, f); gl.bindVertexArray(big.vao);
    const slot = (bigFrame % 3) * DRAWS + d, vOff = slot * VERTS * FLOATS * 4, iOff = slot * IDX * 2;
    gl.bindBuffer(gl.ARRAY_BUFFER, big.vb); gl.bufferSubData(gl.ARRAY_BUFFER, vOff, verts, 0, VERTS * FLOATS);
    setupAttribs(vOff);
    gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, iOff, idx, 0, IDX);
    gl.drawElements(gl.TRIANGLES, IDX, gl.UNSIGNED_SHORT, iOff);
  },
  // No upload: measures only the cost of the draw call itself
  nodata(d, f) {
    gl.bindVertexArray(libgdx.vao); gl.drawElements(gl.TRIANGLES, IDX, gl.UNSIGNED_SHORT, 0);
  }
};

const results = {};
const order = Object.keys(variants);
let vi = 0, start = 0, frames = 0, f = 0;
fill(0, 0); gl.bindVertexArray(libgdx.vao); gl.bindBuffer(gl.ARRAY_BUFFER, libgdx.vb);
gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts, 0, VERTS * FLOATS); gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, 0, idx, 0, IDX);

function show(done) {
  let s = `${navigator.userAgent.match(/\(([^)]+)\)/)[1]}\ncanvas ${canvas.width}x${canvas.height}, ${DRAWS} draw/khung\n\n`;
  for (const k of order) s += `${k.padEnd(8)} ${results[k] ? results[k].fps + ' fps  (' + results[k].ms + ' ms/frame)' : (k === order[vi] && !done ? 'measuring...' : '')}\n`;
  out.textContent = s + (done ? '\nDONE - results sent' : '');
}
function frame(now) {
  if (!start) start = now;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.1, 0.1, 0.15, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
  const run = variants[order[vi]];
  for (let d = 0; d < DRAWS; d++) run(d, f);
  bigFrame++; f++; frames++;
  if (now - start >= MS) {
    results[order[vi]] = { fps: Math.round(frames * 1000 / (now - start) * 10) / 10, ms: Math.round((now - start) / frames * 10) / 10 };
    vi++; start = 0; frames = 0;
    if (vi >= order.length) {
      show(true);
      fetch('/api/perf', { method: 'POST', body: JSON.stringify({ bench: results, canvas: canvas.width + 'x' + canvas.height, draws: DRAWS, ua: navigator.userAgent }) }).catch(() => {});
      return;
    }
  }
  show(false);
  requestAnimationFrame(frame);
}
setTimeout(() => requestAnimationFrame(frame), 500);
</script>
</body>
</html>
