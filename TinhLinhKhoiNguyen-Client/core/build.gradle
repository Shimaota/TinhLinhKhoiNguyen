plugins { id 'java-library' }

// Shared game code. Compiled to Java 8 bytecode so Android (D8) and iOS (RoboVM) can consume it.
java {
    toolchain { languageVersion = JavaLanguageVersion.of(20) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    // RoboVM has no invokedynamic string-concat bootstrap; keep classic StringBuilder concat.
    options.compilerArgs += ['-Xlint:none', '-nowarn', '-XDstringConcat=inline']
}

dependencies {
    // Compile against the full proven runtime; each platform supplies its own runtime flavour.
    compileOnly files(rootProject.ext.fullLibsJar)
    // box2dlights / OkHttp (+Okio) / TextraTypist (+regexodus): real Maven artifacts replacing the obfuscated copies.
    if (rootProject.ext.has('mavenLibs')) {
        rootProject.ext.mavenLibs.each { dep ->
            compileOnly(dep) { exclude group: rootProject.ext.mavenLibsExcludedGroup }
        }
    }
}

// Pure logic tests (no libGDX needed), e.g. the client-side pet movement: gradlew :core:test
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------------------------
// client.properties (repo root, UTF-8) -> classpath (read by ClientConfig): game name, data folder, settings
// folder, default server. Override single keys at build time: environment variable TLNT_SERVER_HOST=... (used by build.bat,
// keeps accented characters) or -Ptlnt.server.host=1.2.3.4 (ASCII only) — see clientConfigOverride in the root build.gradle.
// game.version always comes from appVersionName (gradle.properties).
// ---------------------------------------------------------------------------------------------
def clientConfigFile = rootProject.file('client.properties')
def clientConfigSrc = clientConfigFile.exists() ? clientConfigFile : rootProject.file('client.properties.example')
def clientConfigDir = layout.buildDirectory.dir('generated/client-config')
def clientConfigSrcDir = layout.buildDirectory.dir('generated/sources/clientConfig/java')
def clientConfigKeys = ['game.name', 'storage.folder', 'prefs.folder', 'prefs.prefix', 'server.name', 'server.host', 'server.port', 'server.ws.url']
tasks.register('generateClientConfig') {
    inputs.file(clientConfigSrc)
    inputs.property('version', rootProject.findProperty('appVersionName') ?: '0.0.0')
    inputs.property('overrides', clientConfigKeys.collectEntries { k -> [(k): rootProject.ext.clientConfigOverride(k) ?: ''] })
    outputs.dir(clientConfigDir)
    outputs.dir(clientConfigSrcDir)
    doLast {
        def props = rootProject.ext.loadClientProperties(clientConfigSrc)
        clientConfigKeys.each { k ->
            def v = rootProject.ext.clientConfigOverride(k)
            if (v != null) props.setProperty(k, v)
        }
        props.setProperty('game.version', (rootProject.findProperty('appVersionName') ?: '0.0.0').toString())
        def out = clientConfigDir.get().file('client.properties').asFile
        out.parentFile.mkdirs()
        out.withWriter('UTF-8') { w -> props.store(w, 'Sinh tu client.properties goc - KHONG sua file nay') }

        def javaOut = clientConfigSrcDir.get().file('com/tlnt/core/ClientConfigGenerated.java').asFile
        javaOut.parentFile.mkdirs()
        def esc = { String s -> s ? s.replace('\\', '\\\\').replace('"', '\\"') : '' }
        javaOut.withWriter('UTF-8') { w ->
            w.writeLine 'package com.tlnt.core;'
            w.writeLine ''
            w.writeLine '/**'
            w.writeLine ' * Generated by task :core:generateClientConfig from client.properties - DO NOT EDIT.'
            w.writeLine ' */'
            w.writeLine 'public final class ClientConfigGenerated {'
            w.writeLine "    public static final String GAME_NAME = \"${esc(props.getProperty('game.name', 'Tinh Linh Khoi Nguyen'))}\";"
            w.writeLine "    public static final String VERSION = \"${esc(props.getProperty('game.version', '0.0.2'))}\";"
            w.writeLine "    public static final String STORAGE_FOLDER = \"${esc(props.getProperty('storage.folder', 'Tinh Linh Khoi Nguyen'))}\";"
            w.writeLine "    public static final String PREFS_FOLDER = \"${esc(props.getProperty('prefs.folder', 'tlnt'))}\";"
            w.writeLine "    public static final String PREFS_PREFIX = \"${esc(props.getProperty('prefs.prefix', ''))}\";"
            w.writeLine "    public static final String SERVER_NAME = \"${esc(props.getProperty('server.name', 'TLNT'))}\";"
            w.writeLine "    public static final String SERVER_HOST = \"${esc(props.getProperty('server.host', 'localhost'))}\";"
            w.writeLine "    public static final int SERVER_PORT = ${props.getProperty('server.port', '7502')};"
            w.writeLine "    public static final String SERVER_WS_URL = \"${esc(props.getProperty('server.ws.url', ''))}\";"
            w.writeLine ''
            w.writeLine '    private ClientConfigGenerated() {}'
            w.writeLine '}'
        }

        println ">> client.properties: ${props.getProperty('game.name')} | ${props.getProperty('server.host')}:${props.getProperty('server.port')} | v${props.getProperty('game.version')}"
    }
}
sourceSets.main.resources.srcDir(clientConfigDir)
sourceSets.main.java.srcDir(clientConfigSrcDir)
tasks.named('processResources') { dependsOn 'generateClientConfig' }
tasks.named('compileJava') { dependsOn 'generateClientConfig' }
